name: Testing

# Que el sitio compile en cada PR, antes de llegar a main. El build de
# jekyll-gh-pages.yml corre solo al publicar, así que hasta el 28-sep-2026 un
# cambio que rompía Jekyll se descubría ahí (fase C del plan «Bases firmes del
# ecosistema»). Este job no publica ni inyecta el ID de Analytics.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build con Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
